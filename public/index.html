  .tema {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background-color .2s, border-color .2s, color .2s;
  }
  .tema:hover { border-color: var(--line-strong); }
  .tema:focus-visible { outline: none; box-shadow: var(--foco); }
  .tema .sol { display: none; }
  :root[data-tema="azul"] .tema .sol { display: block; }
  :root[data-tema="azul"] .tema .lua { display: none; }

  /* ===================== CARTÃO ===================== */
  .cartao {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--sombra);
    padding: 24px;
    transition: background-color .3s ease, border-color .3s ease;
  }
  @media (max-width: 400px) { .cartao { padding: 20px 16px; } }

  .rotulo {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--brand-text);
    margin: 0 0 6px;
  }
  h1 { font-size: 1.45rem; line-height: 1.25; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  /* cliente */
  .cliente {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    margin: 0 0 18px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--navy); color: #fff;
    font-weight: 700; font-size: .95rem;
    flex: none;
  }
  :root[data-tema="azul"] .avatar { background: var(--azul); color: var(--brand-ink); }
  .cliente .info { min-width: 0; }
  .cliente .nome { font-weight: 700; overflow-wrap: anywhere; }
  .cliente .tel { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }

  /* aviso */
  .aviso {
    display: flex; gap: 10px; align-items: flex-start;
    border-radius: 12px; padding: 12px 14px; margin: 0 0 16px;
    font-size: .92rem; font-weight: 500;
  }
  .aviso svg { margin-top: 2px; }
  .aviso.erro { background: var(--danger-soft); color: var(--danger); }
  .aviso.ok { background: var(--ok-soft); color: var(--ok); }

  /* busca */
  .busca-wrap { position: relative; margin: 0 0 10px; }
  .busca-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .busca {
    width: 100%; height: 44px;
    font: inherit; color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0 14px 0 40px;
  }
  .busca::placeholder { color: var(--muted); }
  .busca:focus { outline: none; border-color: var(--brand); box-shadow: var(--foco); }

  /* lista de números */
  .secao { font-size: .82rem; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .lista { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
  .opcao {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    min-height: 64px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    cursor: pointer;
    transition: border-color .15s, background-color .15s, transform .12s;
  }
  .opcao:hover { border-color: var(--line-strong); }
  .opcao:active { transform: scale(.985); }
  .opcao input { position: absolute; opacity: 0; pointer-events: none; }
  .opcao .ini {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--brand-soft); color: var(--brand-text);
    font-weight: 800; font-size: .9rem;
    flex: none;
    transition: background-color .15s, color .15s;
  }
  .opcao .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .opcao .nome { font-weight: 700; overflow-wrap: anywhere; }
  .opcao .tel { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .radio {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line-strong);
    display: grid; place-items: center;
    flex: none;
    transition: border-color .15s, background-color .15s;
  }
  .radio svg { color: var(--brand-ink); opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s cubic-bezier(.3, 1.6, .5, 1); }
  .opcao:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
  .opcao:has(input:checked) .ini { background: var(--brand); color: var(--brand-ink); }
  .opcao:has(input:checked) .radio { border-color: var(--brand); background: var(--brand); }
  .opcao:has(input:checked) .radio svg { opacity: 1; transform: scale(1); }
  .opcao:has(input:focus-visible) { box-shadow: var(--foco); }
  .opcao.atual { cursor: not-allowed; background: var(--surface-2); }
  .opcao.atual:hover { border-color: var(--line); }
  .opcao.atual:active { transform: none; }
  .opcao.atual .ini { background: var(--line); color: var(--muted); }
  .tag {
    font-size: .72rem; font-weight: 700;
    color: var(--muted);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
  }
  .vazio { color: var(--muted); text-align: center; padding: 24px 8px; margin: 0; border: 1.5px dashed var(--line); border-radius: 14px; }

  /* interruptor encerrar */
  .interruptor {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 48px;
    padding: 4px 2px;
    margin: 0 0 18px;
    cursor: pointer; user-select: none;
  }
  .interruptor .txt { font-weight: 600; }
  .interruptor .txt small { display: block; font-weight: 500; color: var(--muted); font-size: .82rem; }
  .interruptor input { position: absolute; opacity: 0; pointer-events: none; }
  .trilho {
    width: 44px; height: 26px; border-radius: 999px;
    background: var(--line-strong);
    position: relative; flex: none;
    transition: background-color .2s;
  }
  .trilho::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
  }
  .interruptor input:checked + .trilho { background: var(--brand); }
  .interruptor input:checked + .trilho::after { transform: translateX(18px); }
  .interruptor input:focus-visible + .trilho { box-shadow: var(--foco); }
  .interruptor:has(input:disabled) { cursor: not-allowed; opacity: .55; }

  /* botões */
  .btn {
    width: 100%; min-height: 52px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font: inherit; font-weight: 700; font-size: 1rem;
    padding: 12px 18px;
    border-radius: 14px; border: 0;
    background: var(--brand); color: var(--brand-ink);
    cursor: pointer;
    box-shadow: 0 8px 20px -10px rgba(52, 169, 223, .9);
    transition: filter .15s, opacity .15s, transform .12s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn:focus-visible { outline: none; box-shadow: var(--foco); }
  .btn .rotulo-btn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn.secundario {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--line-strong);
    box-shadow: none; margin-top: 10px;
  }
  .spin {
    width: 18px; height: 18px;
    border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: gira .7s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* sucesso */
  .sucesso { text-align: center; padding: 8px 0 0; }
  .selo {
    width: 76px; height: 76px; margin: 4px auto 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ok-soft); color: var(--ok);
  }
  .selo path { stroke-dasharray: 30; stroke-dashoffset: 0; }
  .sucesso .aviso { text-align: left; }
  .sucesso .sub { margin: 0 0 4px; }

  .rodape { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 16px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 1.5s !important; }
  }
</style>
</head>

  </header>

  <main class="cartao" id="cartao">
    <section id="tela-form">
      <p class="rotulo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
        Transferência
      </p>
      <h1>Transferir atendimento</h1>
      <p class="sub">Escolha o número que vai continuar a conversa. O cliente recebe uma mensagem de modelo por ele.</p>

      <div id="aviso" class="aviso erro" role="alert" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="aviso-txt"></span>
      </div>

      <div class="cliente" id="cliente" hidden>
        <div class="avatar" id="cliente-ini" aria-hidden="true"></div>
        <div class="info">
          <div class="nome" id="cliente-nome"></div>
          <div class="tel" id="cliente-tel"></div>
        </div>
      </div>

      <p class="secao" id="secao">Números disponíveis</p>
      <div class="busca-wrap" id="busca-wrap" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou número" aria-label="Buscar por nome ou número">
      </div>

      <fieldset class="lista" id="lista" aria-labelledby="secao"></fieldset>

      <label class="interruptor">
        <span class="txt">Encerrar atendimento atual<small>A conversa segue só no novo número</small></span>
        <input type="checkbox" id="encerrar" checked>
        <span class="trilho" aria-hidden="true"></span>
      </label>

      <button class="btn" id="btn" type="button" disabled>
        <span class="rotulo-btn" id="btn-txt">Selecione um número</span>
      </button>
    </section>

    <section id="tela-ok" class="sucesso" hidden aria-live="polite">
      <div class="selo">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="check" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1>Transferido!</h1>
      <p class="sub" id="ok-msg"></p>
      <p class="sub">Quando o cliente responder, a conversa segue no novo número. Pode fechar esta janela.</p>
      <div class="aviso erro" id="ok-aviso" hidden style="margin-top:14px"></div>
      <button class="btn secundario" type="button" id="btn-nova">Transferir para outro número</button>
    </section>
  </main>

  <p class="rodape">Frédy · transferência entre números</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Dados colocados pelo n8n no bloco "dados" lá em cima:
  // { k, sessionId, canalAtualId, cliente: { nome, telefone }, canais: [{ id, nome, telefone }], webhookTransferir, erro }
  let dados = null;
  try { dados = JSON.parse(document.getElementById('dados').textContent); } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const $lista = $('lista');
  const $btn = $('btn');
  const $aviso = $('aviso');
  const $encerrar = $('encerrar');
  const $busca = $('busca');

  const canais = (dados && Array.isArray(dados.canais)) ? dados.canais : [];
  const cliente = (dados && dados.cliente) || {};
  const identificado = !!(dados && (dados.sessionId || cliente.telefone));
  let selecionado = null;
  let enviando = false;

  // ---------- animação (Motion). Sem a lib ou com "reduzir movimento", tudo funciona sem animar ----------
  const M = window.Motion;
  const semMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anima = (el, kf, op) => {
    if (!M || semMovimento || !el) return Promise.resolve();
    return M.animate(el, kf, op).finished || Promise.resolve();
  };
  const mola = { type: 'spring', stiffness: 380, damping: 30 };

  // ---------- tema ----------
  const raiz = document.documentElement;
  const $tema = $('btn-tema');
  function aplicarTema(t) {
    raiz.dataset.tema = t;
    const azul = t === 'azul';
    $tema.setAttribute('aria-pressed', String(azul));
    $tema.setAttribute('aria-label', azul ? 'Ativar tema claro' : 'Ativar tema azul');
    document.querySelector('meta[name="theme-color"]').content = azul ? '#0A1626' : '#FFFFFF';
    try { localStorage.setItem('fredy-tema', t); } catch (e) {}
  }
  aplicarTema(raiz.dataset.tema === 'azul' ? 'azul' : 'claro');
  $tema.addEventListener('click', function () {
    aplicarTema(raiz.dataset.tema === 'azul' ? 'claro' : 'azul');
    anima($tema.querySelector(raiz.dataset.tema === 'azul' ? '.sol' : '.lua'),
      { rotate: [-90, 0], scale: [0.5, 1], opacity: [0, 1] }, mola);
  });

  // ---------- util ----------
  function formatarTel(t) {
    const d = String(t || '').replace(/\D/g, '');
    if (d.length === 13 && d.startsWith('55')) return '+55 (' + d.slice(2, 4) + ') ' + d.slice(4, 9) + '-' + d.slice(9);
    if (d.length === 12 && d.startsWith('55')) return '+55 (' + d.slice(2, 4) + ') ' + d.slice(4, 8) + '-' + d.slice(8);
    return t || '';
  }
  function iniciais(nome) {
    const p = String(nome || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }

  function mostrarErro(msg) {
    $('aviso-txt').textContent = msg;
    const novo = $aviso.hidden;
    $aviso.hidden = false;
    anima($aviso, novo ? { opacity: [0, 1], y: [-6, 0] } : { x: [0, -6, 6, -4, 4, 0] }, { duration: 0.35 });
  }

  function atualizarBotao() {
    if (enviando) return;
    const $txt = $('btn-txt');
    if (!identificado) { $btn.disabled = true; $txt.textContent = 'Atendimento não identificado'; return; }
    $btn.disabled = !selecionado;
    $txt.textContent = selecionado ? 'Transferir para ' + selecionado.nome : 'Selecione um número';
  }

  function vazio(texto) {
    $lista.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'vazio';
    p.textContent = texto;
    $lista.append(p);
  }

  const SVG_CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function renderizar(animar) {
    $lista.innerHTML = '';
    if (!canais.length) return vazio('Nenhum número disponível para transferência.');

    const filtro = $busca.value.trim().toLowerCase();
    const filtroDig = filtro.replace(/\D/g, '');
    const visiveis = canais.filter(function (c) {
      if (!filtro) return true;
      return String(c.nome).toLowerCase().includes(filtro) || (filtroDig && String(c.telefone).includes(filtroDig));
    });
    if (!visiveis.length) return vazio('Nenhum número encontrado.');

    visiveis.forEach(function (c) {
      const atual = dados.canalAtualId && c.id === dados.canalAtualId;
      const label = document.createElement('label');
      label.className = 'opcao' + (atual ? ' atual' : '');

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'canal';
      input.value = c.id;
      input.disabled = !!atual;
      input.checked = !!(selecionado && selecionado.id === c.id);
      input.addEventListener('change', function () {
        selecionado = c;
        atualizarBotao();
        anima(label, { scale: [0.97, 1] }, mola);
      });

      const ini = document.createElement('span');
      ini.className = 'ini';
      ini.setAttribute('aria-hidden', 'true');
      ini.textContent = iniciais(c.nome);

      const info = document.createElement('span');
      info.className = 'info';
      const nome = document.createElement('span');
      nome.className = 'nome';
      nome.textContent = c.nome || 'Sem nome';
      const tel = document.createElement('span');
      tel.className = 'tel';
      tel.textContent = formatarTel(c.telefone);
      info.append(nome, tel);

      label.append(input, ini, info);
      if (atual) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'Atual';
        label.append(tag);
      } else {
        const radio = document.createElement('span');
        radio.className = 'radio';
        radio.setAttribute('aria-hidden', 'true');
        radio.innerHTML = SVG_CHECK;
        label.append(radio);
      }
      $lista.append(label);
    });

    if (animar && M) {
      anima($lista.children, { opacity: [0, 1], y: [10, 0] }, { delay: M.stagger(0.045, { startDelay: 0.12 }), duration: 0.35, ease: [0.22, 1, 0.36, 1] });
    }
  }

  async function trocarTela(sai, entra) {
    await anima(sai, { opacity: [1, 0], y: [0, -8] }, { duration: 0.18 });
    sai.hidden = true;
    entra.hidden = false;
    anima(entra, { opacity: [0, 1], y: [10, 0] }, mola);
  }

  async function transferir() {
    if (!selecionado || !identificado || enviando) return;
    enviando = true;
    $aviso.hidden = true;
    $btn.disabled = true;
    $btn.innerHTML = '<span class="spin" aria-hidden="true"></span><span class="rotulo-btn" id="btn-txt">Transferindo…</span>';

    try {
      const resp = await fetch(dados.webhookTransferir, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          k: dados.k,
          sessionId: dados.sessionId || null,
          telefone: cliente.telefone || null,
          nome: cliente.nome || null,
          canalDestinoId: selecionado.id,
          encerrarOrigem: $encerrar.checked,
        }),
      });
      const data = await resp.json().catch(function () { return {}; });
      if (!resp.ok || !data.ok) throw new Error(data.erro || 'O servidor respondeu com erro ' + resp.status + '.');

      $('ok-msg').textContent =
        'Mensagem enviada pelo número ' + selecionado.nome + ' (' + formatarTel(selecionado.telefone) + ').' +
        (data.encerrado ? ' O atendimento atual foi encerrado.' : '');
      const $okAviso = $('ok-aviso');
      $okAviso.hidden = !data.aviso;
      $okAviso.textContent = data.aviso || '';

      await trocarTela($('tela-form'), $('tela-ok'));
      anima(document.querySelector('.selo'), { scale: [0.6, 1] }, { type: 'spring', stiffness: 300, damping: 14 });
      anima($('check'), { strokeDashoffset: [30, 0] }, { duration: 0.45, delay: 0.1, ease: 'ease-out' });
    } catch (e) {
      mostrarErro('A transferência não foi feita. ' + (e.message || 'Verifique a conexão e tente de novo.'));
    } finally {
      enviando = false;
      $btn.innerHTML = '<span class="rotulo-btn" id="btn-txt"></span>';
      atualizarBotao();
    }
  }

  $btn.addEventListener('click', transferir);
  $busca.addEventListener('input', function () { renderizar(false); });
  $('btn-nova').addEventListener('click', function () { trocarTela($('tela-ok'), $('tela-form')); });

  // ---------- início ----------
  anima($('cartao'), { opacity: [0, 1], y: [14, 0] }, mola);

  if (!dados) {
    $encerrar.checked = false;
    $encerrar.disabled = true;
    mostrarErro('Não foi possível identificar o atendimento. Abra esta tela pelo botão dentro da conversa.');
    vazio('Nenhum número carregado.');
  } else {
    if (dados.erro) mostrarErro(dados.erro);
    else if (!identificado) mostrarErro('Não foi possível identificar o atendimento. Abra esta tela pelo botão dentro da conversa.');

    if (cliente.nome || cliente.telefone) {
      $('cliente-ini').textContent = iniciais(cliente.nome || '?');
      $('cliente-nome').textContent = cliente.nome || 'Cliente';
      $('cliente-tel').textContent = formatarTel(cliente.telefone);
      $('cliente').hidden = false;
    }
    if (!dados.sessionId) {
      $encerrar.checked = false;
      $encerrar.disabled = true;
      $encerrar.closest('label').title = 'Sem o id do atendimento não dá pra encerrar automaticamente.';
    }
    $('busca-wrap').hidden = canais.length < 6;
    renderizar(true);
  }
  atualizarBotao();
});
</script>
</body>
</html>
